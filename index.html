<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAS</title>
  <!-- Registration Action Survey -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="title">
      <h1>Registration Action Survey</h1>
      <p class="byline">A Mega Tech &amp; Software Product</p>
    </header>

    <div id="list"></div>

    <section class="add-box">
      <h2>Add a custom box</h2>
      <div class="add-row">
        <input id="new-label" type="text" placeholder="Box label">
        <input id="new-output" type="text" placeholder="Output text (optional)">
        <button id="add">Add</button>
      </div>
    </section>

    <label class="field">
      Other
      <input id="note" type="text" placeholder="Type anything extra…">
    </label>

    <label class="field small">
      Initials
      <input id="initials" type="text" maxlength="5" placeholder="TJ">
    </label>

    <section class="output">
      <h2>Output</h2>
      <div id="preview" class="preview"></div>
      <div class="actions">
        <button id="copy" class="icon-btn" title="Copy">
          <img class="icon" src="assets/copy.png" alt="Copy">
        </button>
        <button id="copy-clear" class="icon-btn" title="Copy &amp; Clear">
          <img class="icon" src="assets/copy.png" alt="Copy">&amp;<img class="icon" src="assets/trash.png" alt="Clear">
        </button>
        <button id="reset" class="secondary">Reset</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
